[[artifact]]
name = "bridge-host"
kind = "program"
sources = ["src/**/*.c"]
include = ["{bridge}/include", "src", "src/config", "src/manifest", "src/state", "src/toml", "src/show", "{bridge_os}/include"]
defines = ['LIBRARY_SUFFIX="{library}"']
flags = ["{system_defines}", "{system_libraries}"]
link = ["{bridge}/bridge.a", "{bridge_os}/os.a"]

[[artifact]]
name = "host-unit"
kind = "program"
test = true
sources = ["tests/unit/*.c", "src/toml/*.c", "src/config/config_value.c"]
include = ["{bridge}/include", "src", "src/config", "src/manifest", "src/state", "src/toml", "src/show"]
flags = ["{system_defines}", "{system_libraries}"]

[[artifact]]
name = "hello"
kind = "host_wasm"
test = true
folder = "fixtures"
sources = ["tests/modules/hello.c"]
include = ["{bridge}/include", "{bb_wasm}/include", "tests/modules"]
defines = ['SAY="hello from the host"']
manifest = ["bridge-host:hello@1.0.0", "{own}"]
variants = [
    { name = "plain", unstamped = true },
    { name = "other", defines = ['SAY="hello from elsewhere"'] },
    { name = "debugger", defines = ['SAY="deep"', "SAY_LEVEL=BRIDGE_LOG_DEBUG"], manifest = ["bridge-host:debugger@1.0.0", "{own}"] },
    { name = "wender", defines = ['SAY="ends"', "END_AT=3"], manifest = ["bridge-host:wender@1.0.0", "{own}"] },
]

[[artifact]]
name = "quiet"
kind = "host_wasm"
test = true
folder = "fixtures"
sources = ["tests/modules/hello.c"]
include = ["{bridge}/include", "{bb_wasm}/include", "tests/modules"]
defines = ["ONCE", 'SAY="said once"']
manifest = ["bridge-host:quiet@1.0.0", "{own}"]
variants = [
    { name = "quiet2", defines = ["ONCE", 'SAY="said once, again"'] },
    { name = "noabi", manifest = ["bridge-host:noabi@1.0.0", "pinned=false", "reloadable=false", "config=none"] },
    { name = "mute", manifest = ["bridge-host:mute@1.0.0", "abi=1", "reloadable=false", "config=none"] },
    { name = "swap", defines = ["ONCE", 'SAY="swaps"'], manifest = ["bridge-host:swap@1.0.0", "abi=1", "pinned=false", "reloadable=true", "config=none"] },
    { name = "swap2", defines = ["ONCE", 'SAY="swapped"'], manifest = ["bridge-host:swap@1.0.0", "abi=1", "pinned=false", "reloadable=true", "config=none"] },
    { name = "abitwo", manifest = ["bridge-host:abitwo@1.0.0", "abi=2", "pinned=false", "reloadable=false", "config=none"] },
    { name = "badabi", manifest = ["bridge-host:badabi@1.0.0", "abi=x", "pinned=false", "reloadable=false", "config=none"] },
    { name = "noconfig", manifest = ["bridge-host:noconfig@1.0.0", "abi=1", "pinned=false", "reloadable=false"] },
    { name = "noreload", manifest = ["bridge-host:noreload@1.0.0", "abi=1", "pinned=false", "config=none"] },
    { name = "nocolon", manifest = ["nocolon", "abi=1", "pinned=false", "reloadable=false", "config=none"] },
    { name = "nocat", manifest = ["has:colon", "abi=1", "pinned=false", "reloadable=false", "config=none"] },
    { name = "firsteq", manifest = ["x:y@1=v", "abi=1", "pinned=false", "reloadable=false", "config=none"] },
    { name = "bareword", manifest = ["bw:x@1", "bareword", "abi=1", "pinned=false", "reloadable=false", "config=none"] },
    { name = "unknownkey", manifest = ["bridge-host:unknownkey@1.0.0", "abi=1", "pinned=false", "reloadable=false", "config=none", "colour=blue"] },
    { name = "longid", manifest = ["i:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd@1", "abi=1"] },
    { name = "emptyabi", manifest = ["ea:x@1", "abi="] },
    { name = "longconfig", manifest = ["lc:x@1", "abi=1", "pinned=false", "reloadable=false", "config=cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"] },
    { name = "badflag", manifest = ["bf:x@1", "abi=1", "pinned=maybe", "reloadable=false", "config=none"] },
    { name = "negabi", manifest = ["ng:x@1", "abi=-5", "pinned=false", "reloadable=false", "config=none"] },
    { name = "relfirst", manifest = ["rf:x@1", "abi=1", "reloadable=false", "pinned=false", "config=none"] },
    { name = "id127", manifest = ["i:ddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd@1", "{own}"] },
    { name = "longbare", manifest = ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "abi=1"] },
