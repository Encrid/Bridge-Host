sources = ["tests/modules/knock.c"]
include = ["{bridge}/include", "{bb_native}/include", "tests/modules"]
manifest = ["bridge-host:knock@1.0.0", "{own}"]
variants = [
    { name = "wait", defines = ["WAIT"], manifest = ["bridge-host:wait@1.0.0", "{own}"] },
    { name = "asker", defines = ["WAIT_EACH"], manifest = ["bridge-host:asker@1.0.0", "{own}"] },
    { name = "nender", defines = ["END_AT=3"], manifest = ["bridge-host:nender@1.0.0", "{own}"] },
    { name = "pe", target = "x86_64-windows-gnu", manifest = ["bridge-host:pe@1.0.0", "{own}"] },
    { name = "elf", target = "x86_64-linux-gnu", manifest = ["bridge-host:elf@1.0.0", "{own}"] },
    { name = "macho", target = "aarch64-macos", manifest = ["bridge-host:macho@1.0.0", "{own}"] },
]

