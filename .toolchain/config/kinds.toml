[kinds.host_native]
output = "{name}{library}"
steps = [
    { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "-O2", "-DNDEBUG", "-g0", "-s", "{language}", "{pic}", "{include}", "-fvisibility=hidden", '-DMANIFEST="{manifest:\0}"', '-DMANIFEST_SECTION="{section}"', "-shared", "{defines}", "{sources}", "{runtime}", "-o", "{output}"] },
    { contains = "{manifest:\u0000}" },
]

[kinds.madebin]
output = "{name}.bin"
steps = [
    { run = ["{python}", "tests/modules/mkbin.py", "{output}", "{name}"] },
]
