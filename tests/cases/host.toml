code = ["include/**", "src/host/config/**", "src/host/file_bytes.c", "src/host/file_bytes.h", "src/host/host.h", "src/host/host_again.c", "src/host/host_arrive.c", "src/host/host_end.c", "src/host/host_free.c", "src/host/host_list.c", "src/host/host_load.c", "src/host/host_lock.c", "src/host/host_look.c", "src/host/host_meet.c", "src/host/host_path.c", "src/host/host_run.c", "src/host/host_slot.c", "src/host/host_stop.c", "src/host/host_walk.c", "src/host/host_watch.c", "src/host/main.c", "src/host/say.c", "src/host/say.h", "tests/modules/hello.c", "tests/modules/hello.h", "tests/modules/word.h", "tests/presets/test.toml", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "it runs"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/hello.toml"]

[case.claims]
status = 0
order = [
    "record[6] bridge-host:hello@1.0.0/say: hello from the host 1 0",
    "record[6] bridge-host:hello@1.0.0/say: hello from the host 2 0",
    "record[6] bridge-host:hello@1.0.0/say: hello from the host 3 0",
    "destroyed: 0",
]

[case.folders]
"{case}/hello" = ["hello"]

[case.files]
"{case}/hello.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 3
[content]
paths = ["hello"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/hello" = ["other"]

[[case]]
name = "no backend"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/nothing.toml"]

[case.claims]
status_not = 0
has = ["cannot open backend library"]

[case.folders]
"{case}/nothing" = ["hello"]

[case.files]
"{case}/nothing.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 3
[content]
paths = ["nothing"]
[backend.wasm]
library = "{out}/no-such-backend{library}"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/nothing.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 3
[content]
paths = ["nothing"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[[case]]
name = "no module"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/no-such-folder.toml"]

[case.claims]
status_not = 0
line = ["cannot look in 'no-such-folder'"]

[case.files]
"{case}/no-such-folder.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 3
[content]
paths = ["no-such-folder"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/no-such-folder" = ["hello"]

[[case]]
name = "a file over the files it names"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/over.toml"]

[case.claims]
line = ["ended after 2 rounds, as many as it was given"]

[case.folders]
"{case}/hello" = ["hello"]

[case.files]
"{case}/three.toml" = '''
rounds = 3
'''
"{case}/over.toml" = '''
presets = ["{root}/tests/presets/test.toml", "{case}/three.toml"]
phases = ["update"]
again = {}
rounds = 2
[content]
paths = ["hello"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/over.toml" = '''
presets = ["{root}/tests/presets/test.toml", "{case}/three.toml"]
phases = ["update"]
again = {}
[content]
paths = ["hello"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''
