[[case]]
name = "a module that asks again 2 times runs its phase 3 times in one round"
run = ["{out}/bridge-host{exe}", "{case}/a.toml"]

[case.claims]
status = 0
has = ["record[6] bridge-host:again2@1.0.0/say: run 3 0"]
lacks = ["asked again"]

[case.folders]
"{case}/ca" = ["again2"]

[case.files]
"{case}/a.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = { update = 8 }
rounds = 1
[content]
paths = ["ca"]
[content.arrive]
native = "load"
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/a.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
