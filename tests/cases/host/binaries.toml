[[case]]
name = "malformed libraries of each format, read for a manifest"
run = ["{out}/bridge-host{exe}", "{case}/mb.toml"]

[case.claims]
status = 0
has = [
    "not a module: bin/pe_farhdr.bin: no manifest",
    "not a module: bin/pe_nosig.bin: no manifest",
    "not a module: bin/pe_oob.bin: no manifest",
    "not a module: bin/elf_farshoff.bin: no manifest",
    "not a module: bin/elf_oob.bin: no manifest",
    "not a module: bin/macho_oob.bin: no manifest",
    "not a module: bin/wasm_bigsec.bin: no manifest",
]

[case.folders]
"{case}/bin" = [
    "pe_farhdr", "pe_edge", "pe_nosig", "pe_notbridge", "pe_shorttab",
    "pe_oob", "pe_bigsize", "elf_farshoff", "elf_badcount", "elf_badstrndx",
    "elf_nobridge", "elf_oob", "elf_bigsize", "elf_nameoob", "elf_nameedge",
    "elf_namesoob",
    "macho_oob", "macho_bigsize", "macho_notext", "macho_nosec", "macho_notseg",
    "macho_secoob", "macho_secedge", "macho_cmd0", "macho_manycmd",
    "wasm_bigsec", "wasm_badname", "wasm_longleb", "wasm_cutleb",
    "wasm_emptyman", "wasm_nulfirst",
]

[case.files]
"{case}/mb.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["bin"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/bin" = ["quiet"]

[[case]]
name = "a manifest whose last word has no zero byte is refused"
run = ["{out}/bridge-host{exe}", "{case}/mb.toml"]

[case.claims]
status = 0
has = ["not loaded: bin/wasm_nozero.bin: nz:x@1 its manifest has a word with no zero byte at its end"]

[case.folders]
"{case}/bin" = ["wasm_nozero"]

[case.files]
"{case}/mb.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["bin"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/bin" = ["quiet"]

[[case]]
name = "an empty manifest is refused"
run = ["{out}/bridge-host{exe}", "{case}/mb.toml"]

[case.claims]
status = 0
has = ["not a module: bin/wasm_emptyman.bin: its manifest is empty"]

[case.folders]
"{case}/bin" = ["wasm_emptyman"]

[case.files]
"{case}/mb.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["bin"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/bin" = ["quiet"]

[[case]]
name = "a file of no known format is not a module"
run = ["{out}/bridge-host{exe}", "{case}/mb.toml"]

[case.claims]
status = 0
has = ["not a module: odd/note.txt: neither a wasm module nor a library"]

[case.files]
"{case}/odd/note.txt" = "a note, and no module"
"{case}/mb.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["odd"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/mb.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/mods" = ["quiet"]
