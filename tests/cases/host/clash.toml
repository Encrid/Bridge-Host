code = ["include/**", "src/host/config/**", "src/host/file_bytes.c", "src/host/file_bytes.h", "src/host/host.h", "src/host/host_again.c", "src/host/host_alloc.c", "src/host/host_alloc.h", "src/host/host_end.c", "src/host/host_free.c", "src/host/host_list.c", "src/host/host_load.c", "src/host/host_lock.c", "src/host/host_look.c", "src/host/host_meet.c", "src/host/host_path.c", "src/host/host_run.c", "src/host/host_slot.c", "src/host/host_stop.c", "src/host/host_walk.c", "src/host/host_watch.c", "src/host/main.c", "src/host/say.c", "src/host/say.h", "tests/modules/hello.h", "tests/modules/knock.c", "tests/modules/word.c", "tests/modules/word.h", "tests/presets/grants.toml", "tests/presets/native.toml", "tests/presets/test.toml", "tests/presets/world.toml", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "a module key that two presets state two ways is refused"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/mt.toml"]

[case.claims]
status = 1
has = ["refused: scratch: 65536 in {root}/tests/presets/world.toml:42, 1024 in ma.toml:2"]

[case.folders]
"{case}/mods" = ["knock"]

[case.files]
"{case}/ma.toml" = '''
[module."bridge-host:knock@1.0.0"]
scratch = 1024
'''
"{case}/mt.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml", "ma.toml"]
phases = ["update"]
again = {}
rounds = 8
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/ma.toml" = '''
[module."bridge-host:knock@1.0.0"]
scratch = 65536
'''

[[case]]
name = "a setting that the manifest names twice is taken one time"
process = "command"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/dt.toml"]

[case.claims]
status = 1
has = ["not stated: config.dup"]

[case.folders]
"{case}/dups" = ["dupset"]

[case.files]
"{case}/dt.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["late"]
again = {}
rounds = 1
[content]
paths = ["dups"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/dups" = ["word"]
