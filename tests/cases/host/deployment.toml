[[case]]
name = "in one file the table of the identity is over the table of the backend, and that one is over all"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/tables.toml"]

[case.claims]
status = 0
has = ["log_ring = 111  tables.toml:7", "log_ring = 222  tables.toml:9"]
lacks = ["log_ring = 333"]

[case.folders]
"{case}/mods" = ["quiet", "hello"]

[case.files]
"{case}/tables.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["mods"]
[module."bridge-host:quiet@1.0.0"]
log_ring = 111
[module.wasm]
log_ring = 222
[module.all]
log_ring = 333
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/tables.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["mods"]
[module.wasm]
log_ring = 222
[module.all]
log_ring = 333
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

