[[case]]
name = "a value of a wrong form is refused, for each kind of key"
run = ["{out}/bridge-host{exe}", "{case}/forms.toml"]

[case.claims]
status = 1
line = [
    "refused: forms.toml:1: threads: a whole number, from 1",
    "refused: forms.toml:2: rounds: a whole number, from 0 to 1000000",
    "refused: forms.toml:3: phases: a list of names",
    "refused: forms.toml:4: stack: a whole number, from 1",
    'refused: forms.toml:6: budget.sparse_sets: a whole number, from 1, or "none"',
    "refused: forms.toml:8: order.before: a list of pairs of systems",
    "refused: forms.toml:10: backend.wasm.library: text",
    'refused: forms.toml:12: content.arrive.wasm: "ask", "load" or "leave"',
    "refused: forms.toml:14: module.all.hot_reload: true or false",
    'refused: forms.toml:15: module.all.on_error: "fail" or "skip"',
    "refused: forms.toml:16: module.all.log_level: a level, from 1 to 7",
    'refused: forms.toml:17: module.all.losses: a list of names, or "none"',
    'refused: forms.toml:19: module."bridge-host:word@1.0.0".config.word: text, a number, true or false, or { path = "..." }',
]

[case.folders]
"{case}/mods" = ["quiet"]

[case.files]
"{case}/forms.toml" = '''
threads = 0
rounds = 1000001
phases = "update"
stack = 0
[budget]
sparse_sets = 0
[order]
before = [["a"]]
[backend.wasm]
library = 1
[content.arrive]
wasm = "maybe"
[module.all]
hot_reload = 1
on_error = "stop"
log_level = 8
losses = "all"
[module."bridge-host:word@1.0.0".config]
word = [1, 2]
'''

[case.false.files]
"{case}/forms.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

