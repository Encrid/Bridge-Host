code = ["include/**", "src/host/config/**", "src/host/file_bytes.c", "src/host/file_bytes.h", "src/host/host.h", "src/host/host_again.c", "src/host/host_arrive.c", "src/host/host_end.c", "src/host/host_free.c", "src/host/host_list.c", "src/host/host_load.c", "src/host/host_lock.c", "src/host/host_look.c", "src/host/host_meet.c", "src/host/host_path.c", "src/host/host_run.c", "src/host/host_slot.c", "src/host/host_stop.c", "src/host/host_walk.c", "src/host/host_watch.c", "src/host/main.c", "src/host/say.c", "src/host/say.h", "tests/modules/hello.c", "tests/modules/hello.h", "tests/modules/word.h", "tests/presets/native.toml", "tests/presets/test.toml", "tests/presets/wasm.toml", "tests/presets/world.toml", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "a config named with only a backslash"
process = "command"
run = ["{out}/bridge-host{exe}", "no-such-dir-98765\\deep.toml"]

[case.claims]
status = 1
has = ["cannot go into '"]

[case.false]
run = ["{out}/bridge-host{exe}", "no-such-dir-98765_deep.toml"]

[[case]]
name = "a config whose backslash comes before a slash"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/no\\such/deep.toml"]

[case.claims]
status = 1
has = ["cannot go into '"]

[case.false.folders]
"{case}/no\\such" = []

[[case]]
name = "a world that states no phases but states its counts"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/np.toml"]

[case.claims]
status = 1
has = ["not stated: phases"]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/np.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/wasm.toml", "{root}/tests/presets/native.toml"]
rounds = 8
[content]
paths = ["cq"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/np.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 8
[content]
paths = ["cq"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[[case]]
name = "a table for an unfound module, beside a non-module file"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/uf.toml"]

[case.claims]
status = 1
has = [
    "refused: uf.toml:5: bridge-host:nobody@1.0.0: no module found is it",
    "found: bridge-host:quiet@1.0.0",
]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/cq/junk.txt" = "not a module"
"{case}/uf.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 8
[module."bridge-host:nobody@1.0.0"]
hot_reload = false
[content]
paths = ["cq"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/uf.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 8
[content]
paths = ["cq"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''
