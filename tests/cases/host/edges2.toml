code = ["include/**", "src/host/config/**", "src/host/file_bytes.c", "src/host/file_bytes.h", "src/host/host.h", "src/host/host_again.c", "src/host/host_arrive.c", "src/host/host_end.c", "src/host/host_free.c", "src/host/host_load.c", "src/host/host_lock.c", "src/host/host_look.c", "src/host/host_meet.c", "src/host/host_path.c", "src/host/host_run.c", "src/host/host_slot.c", "src/host/host_stop.c", "src/host/host_walk.c", "src/host/host_watch.c", "src/host/main.c", "src/host/say.c", "src/host/say.h", "src/host/show/show.c", "src/manifest/manifest.c", "src/manifest/manifest_check.c", "src/manifest/manifest_find.c", "src/manifest/manifest_inside.h", "src/manifest/manifest_keys.c", "src/manifest/manifest_list.c", "src/manifest/manifest_made.c", "src/manifest/manifest_phase.c", "src/manifest/manifest_rules.c", "src/manifest/manifest_setting.c", "src/manifest/manifest_state.c", "src/manifest/manifest_take.c", "src/manifest/manifest_wasm.c", "src/manifest/manifest_word.c", "src/manifest/manifest_words.c", "tests/modules/hello.c", "tests/modules/hello.h", "tests/modules/word.h", "tests/presets/test.toml", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "a world that runs for as long as there is work"
run = ["{out}/bridge-host{exe}", "{case}/zero.toml"]

[case.claims]
status = 0
has = ["record[6] bridge-host:quiet@1.0.0/say: said once 1 0"]
lacks = ["ended after"]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/zero.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 0
[content]
paths = ["cq"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/zero.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 1
[content]
paths = ["cq"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[[case]]
name = "the config shown when it is refused"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/bad.toml"]

[case.claims]
status = 1
has = ["bogus: no key of Bridge-Host's or Bridge's"]

[case.files]
"{case}/bad.toml" = '''
bogus = 1
'''

[case.false.files]
"{case}/bad.toml" = '''
rounds = 1
'''

[[case]]
name = "the config shown with a content path that is not there"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/gone.toml"]

[case.claims]
status = 1
has = ["cannot look in 'notthere'"]

[case.files]
"{case}/gone.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 8
[content]
paths = ["notthere"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/notthere" = ["quiet"]
