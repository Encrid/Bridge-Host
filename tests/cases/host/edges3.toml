code = ["include/**", "src/host/config/config.c", "src/host/config/config.h", "src/host/config/config_again.c", "src/host/config/config_backend.c", "src/host/config/config_backend_settings.c", "src/host/config/config_check.c", "src/host/config/config_check_module.c", "src/host/config/config_check_world.c", "src/host/config/config_content.c", "src/host/config/config_file.c", "src/host/config/config_find.c", "src/host/config/config_free.c", "src/host/config/config_keys.c", "src/host/config/config_name.c", "src/host/config/config_names.c", "src/host/config/config_order.c", "src/host/config/config_path.c", "src/host/config/config_say.c", "src/host/config/config_states.c", "src/host/config/config_unloads.c", "src/host/config/config_value.c", "src/host/config/config_world.c", "src/host/file_bytes.c", "src/host/file_bytes.h", "src/host/host.h", "src/host/host_free.c", "src/host/host_list.c", "src/host/host_path.c", "src/host/host_walk.c", "src/host/host_watch.c", "src/host/main.c", "src/host/say.c", "src/host/say.h", "tests/modules/hello.h", "tests/modules/word.c", "tests/modules/word.h", "tests/presets/test.toml", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "a phase taken after a conflicting one is refused"
process = "command"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/pp.toml"]

[case.claims]
status = 1
has = ["refused: phases.foo: "]

[case.folders]
"{case}/mods" = ["word"]

[case.files]
"{case}/pa.toml" = '''
[module."bridge-host:word@1.0.0".phases]
foo = "update"
'''
"{case}/pb.toml" = '''
[module."bridge-host:word@1.0.0".phases]
foo = "late"
'''
"{case}/pp.toml" = '''
presets = ["{root}/tests/presets/test.toml", "pa.toml", "pb.toml"]
phases = ["update", "late"]
again = {}
rounds = 8
[module.all.phases]
bar = "update"
[module."bridge-host:word@1.0.0".config]
word = "hi"
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/pa.toml" = '''
[module."bridge-host:word@1.0.0".phases]
foo = "update"
'''
"{case}/pb.toml" = '''
[module."bridge-host:word@1.0.0".phases]
foo = "update"
'''
"{case}/pp.toml" = '''
presets = ["{root}/tests/presets/test.toml", "pa.toml", "pb.toml"]
phases = ["update", "late"]
again = {}
rounds = 8
[module.all.phases]
bar = "update"
[module."bridge-host:word@1.0.0".config]
word = "hi"
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''
