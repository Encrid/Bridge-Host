[[case]]
name = "a world that states threads and rounds, and no live"
run = ["{out}/bridge-host{exe}", "{case}/nolive.toml"]

[case.claims]
status = 1
has = ["not stated: live"]

[case.files]
"{case}/nolive.toml" = '''
threads = 1
phases = ["update"]
rounds = 4
'''

[case.false.files]
"{case}/nolive.toml" = '''
threads = 1
phases = ["update"]
rounds = 4
live = false
'''

[[case]]
name = "the profile of each system comes at the end of the run, before the world is destroyed"
run = ["{out}/bridge-host{exe}", "{case}/e.toml"]

[case.claims]
status = 0
matches = ["still loaded: bridge-host:knock@1\\.0\\.0\nprofile bridge-host:knock:say: 0 calls, [0-9]+ ns\ndestroyed: 0"]

[case.folders]
"{case}/mods" = ["knock"]

[case.files]
"{case}/e.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
rounds = 3
[checks]
profile = true
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/e.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
