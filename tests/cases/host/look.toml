[[case]]
name = "a folder that the system does not watch is read at each round, after one line"
run = ["{out}/bridge-host{exe}", "{case}/unwatched.toml"]
fail = { os_watch_start = 1 }
script = [{ wait = "? go on", put = { "{case}/unwatched/quiet.wasm" = "quiet" }, type = "go" }]

[case.claims]
status = 0
order = [
    "cannot watch 'unwatched': read at each round",
    "? go on",
    "loaded: bridge-host:quiet@1.0.0, wasm, unwatched/quiet.wasm",
]

[case.folders]
"{case}/unwatched" = ["wait"]

[case.files]
"{case}/unwatched.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["unwatched"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false]
fail = {}

[[case]]
name = "a watch that stops starts again, after a read of its whole folder"
run = ["{out}/bridge-host{exe}", "{case}/stopped.toml"]
fail = { os_watch_take = 1 }
script = [{ wait = "? go on", put = { "{case}/stopped/quiet.wasm" = "quiet" }, type = "go" }]

[case.claims]
status = 0
order = ["? go on", "loaded: bridge-host:quiet@1.0.0, wasm, stopped/quiet.wasm"]
lacks = ["cannot watch"]

[case.folders]
"{case}/stopped" = ["wait"]

[case.files]
"{case}/stopped.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["stopped"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false]
script = [{ wait = "? go on", type = "go" }]

[[case]]
name = "a watch that cannot start again leaves its folder read at each round, after one line"
run = ["{out}/bridge-host{exe}", "{case}/again.toml"]
fail = { os_watch_take = 1, os_watch_start = 2 }
script = [{ wait = "? go on", put = { "{case}/again/quiet.wasm" = "quiet" }, type = "go" }]

[case.claims]
status = 0
order = [
    "? go on",
    "cannot watch 'again': read at each round",
    "loaded: bridge-host:quiet@1.0.0, wasm, again/quiet.wasm",
]

[case.folders]
"{case}/again" = ["wait"]

[case.files]
"{case}/again.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["again"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false]
fail = { os_watch_take = 1 }

[[case]]
