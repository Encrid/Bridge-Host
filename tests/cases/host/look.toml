[[case]]
name = "a run with live = false reads every file before it ends, and loads a module that got a free slot"
run = ["{out}/bridge-host{exe}", "{case}/ending.toml"]
script = [{ wait = "? go on", remove = ["{case}/first/quiet.wasm"], type = "go" }]

[case.claims]
status = 0
order = [
    "too many files: 2 are looked at",
    "? go on",
    "unloaded: bridge-host:quiet@1.0.0: first/quiet.wasm is gone",
    "loaded: bridge-host:swap@1.0.0, wasm, second/swap.wasm",
]

[case.folders]
"{case}/first" = ["wait", "quiet"]
"{case}/second" = ["swap"]

[case.files]
"{case}/ending.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["first", "second"]
files = 2
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false]
script = [{ wait = "? go on", type = "go" }]

