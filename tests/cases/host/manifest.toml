[[case]]
name = "manifests that the reader refuses, word by word"
run = ["{out}/bridge-host{exe}", "{case}/mf.toml"]

[case.claims]
status = 0
has = [
    "not a module: bad/nocolon.wasm: its manifest does not begin with who it is",
    "not a module: bad/nocat.wasm: its manifest does not begin with who it is",
    "not a module: bad/firsteq.wasm: its manifest does not begin with who it is",
    "not loaded: bad/bareword.wasm: bw:x@1 states a bareword that cannot be",
    "not a module: bad/longid.wasm: its identity has more than 127 bytes",
    "not loaded: bad/emptyabi.wasm: ea:x@1 states a abi that cannot be",
    "not loaded: bad/badflag.wasm: bf:x@1 states a pinned that cannot be",
]

[case.folders]
"{case}/bad" = ["nocolon", "nocat", "firsteq", "bareword", "longid", "emptyabi", "badabi", "negabi", "relfirst", "badflag"]

[case.files]
"{case}/mf.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["bad"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/bad" = ["quiet"]

[[case]]
name = "an identity of 127 bytes is read"
run = ["{out}/bridge-host{exe}", "{case}/id.toml"]

[case.claims]
status = 0
matches = ["loaded: i:d{123}@1, wasm, ids/id127\\.wasm"]

[case.folders]
"{case}/ids" = ["id127"]

[case.files]
"{case}/id.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["ids"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/ids" = ["longid"]

[[case]]
name = "the first word is checked for its colon before its length"
run = ["{out}/bridge-host{exe}", "{case}/id.toml"]

[case.claims]
status = 0
has = ["not a module: ids/longbare.wasm: its manifest does not begin with who it is"]

[case.folders]
"{case}/ids" = ["longbare"]

[case.files]
"{case}/id.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["ids"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/ids" = ["quiet"]

[[case]]
name = "the message of a refused word shows at most its first 60 bytes"
run = ["{out}/bridge-host{exe}", "{case}/lw.toml"]

[case.claims]
status = 0
matches = ["lw:x@1 states a w{60} that cannot be"]

[case.folders]
"{case}/bad" = ["longword"]

[case.files]
"{case}/lw.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["bad"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/bad" = ["quiet"]

[[case]]
name = "an author word that the manifest states twice is refused"
run = ["{out}/bridge-host{exe}", "{case}/tw.toml"]

[case.claims]
status = 0
line = ["not loaded: mods/twice{library}: bridge-host:twice@1.0.0 states reloadable twice"]
lacks = ["loaded: bridge-host:twice@1.0.0"]

[case.folders]
"{case}/mods" = ["twice"]

[case.files]
"{case}/tw.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/mods" = ["knock"]

[[case]]
name = "a default that the manifest states twice is refused when the host reads it"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/td.toml"]

[case.claims]
status = 1
line = ["  refused: its file states config.word twice"]

[case.folders]
"{case}/mods" = ["twiceset"]

[case.files]
"{case}/td.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update", "late"]
rounds = 8
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/mods" = ["owned"]

[[case]]
name = "a default that the manifest states twice is not refused when a file states its key"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/td.toml"]

[case.claims]
status = 0
line = ['  config.word = "hi"  td.toml:5']

[case.folders]
"{case}/mods" = ["twiceset"]

[case.files]
"{case}/td.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update", "late"]
rounds = 8
[module."bridge-host:twiceset@1.0.0".config]
word = "hi"
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/td.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update", "late"]
rounds = 8
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''
