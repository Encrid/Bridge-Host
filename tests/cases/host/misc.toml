validate = false
usage = false
[records]
written = 6
failing = 3
[content]
paths = ["sm"]
files = 32
depth = 1
[content.start]
wasm = "load"
native = "load"
[content.arrive]
wasm = "load"
native = "ask"
[module.all]
hot_reload = false
on_error = "skip"
max_system_failures = 3
log_level = 7
scratch = 65536
log_ring = 6144
spans = 16384
spawns = "none"
