[[case]]
name = "two arguments where the first is not the show flag"
run = ["{out}/bridge-host{exe}", "{case}/none.toml", "extra"]

[case.claims]
status = 2
has = ["usage: bridge-host"]

[case.false]
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/none.toml"]

[[case]]
name = "an argument that begins with a dash"
run = ["{out}/bridge-host{exe}", "-x"]

[case.claims]
status = 2
has = ["usage: bridge-host"]

[case.false]
run = ["{out}/bridge-host{exe}", "{case}/none.toml"]

[[case]]
name = "the config shown with an empty file, a non-module, and a module with no load"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/sm.toml"]

[case.claims]
status = 1
has = [
    "module bridge-host:quiet@1.0.0, wasm, sm/quiet.wasm",
    "not stated: content.load.all",
    "not a module: sm/junk.txt",
]

[case.folders]
"{case}/sm" = ["quiet"]

[case.files]
"{case}/sm/empty.wasm" = ""
"{case}/sm/junk.txt" = "junk"
"{case}/sm.toml" = '''
threads = 1
live = false
stack = 1048576
observer_passes = 1
table_growth = 150
table_hash_fill = 50
table_retry = 50
phases = ["update"]
rounds = 8
[budget]
entities = 8192
tables = 8
types = 16
systems = 16
terms = 8
modules = 8
persistent = 262144
columns = 1048576
sparse_sets = "none"
direct_indexed = "none"
[checks]
profile = false
validate = false
[records]
written = 6
failing = 3
[content]
paths = ["sm"]
[content.arrive]
wasm = "load"
native = "ask"
[module.all]
hot_reload = false
on_error = "skip"
max_system_failures = 3
log_level = 7
scratch = 65536
log_ring = 6144
spans = 16384
spawns = "none"
persistent = "none"
changes = 1048576
losses = "none"
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/sm.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["sm"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[[case]]
name = "a module that logs below the shown level"
run = ["{out}/bridge-host{exe}", "{case}/dbg.toml"]

[case.claims]
status = 0
has = ["loaded: bridge-host:debugger@1.0.0, wasm"]
lacks = ["deep"]

[case.folders]
"{case}/mods" = ["debugger"]

[case.files]
"{case}/dbg.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/mods" = ["hello"]

[[case]]
name = "a record of a level above the written level is not written"
run = ["{out}/bridge-host{exe}", "{case}/rec.toml"]

[case.claims]
status = 0
line = ["loaded: bridge-host:knock@1.0.0, native, mods/knock{library}"]
lacks = ["record[6] bridge-host:knock@1.0.0/say: knock 0 0"]

[case.folders]
"{case}/mods" = ["knock"]

[case.files]
"{case}/rec.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
rounds = 8
[records]
written = 5
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/rec.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
rounds = 8
[records]
written = 6
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[[case]]
name = "a record of the failing level or lower makes the run fail"
run = ["{out}/bridge-host{exe}", "{case}/rec.toml"]

[case.claims]
status = 1
line = ["record[6] bridge-host:knock@1.0.0/say: knock 0 0"]

[case.folders]
"{case}/mods" = ["knock"]

[case.files]
"{case}/rec.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
rounds = 8
[records]
failing = 6
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/rec.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
rounds = 8
[records]
failing = 3
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''
