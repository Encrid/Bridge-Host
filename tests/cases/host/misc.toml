code = ["include/**", "src/host/config/**", "src/host/file_bytes.c", "src/host/file_bytes.h", "src/host/host.h", "src/host/host_again.c", "src/host/host_alloc.c", "src/host/host_alloc.h", "src/host/host_arrive.c", "src/host/host_end.c", "src/host/host_free.c", "src/host/host_go.c", "src/host/host_list.c", "src/host/host_load.c", "src/host/host_lock.c", "src/host/host_look.c", "src/host/host_meet.c", "src/host/host_path.c", "src/host/host_run.c", "src/host/host_slot.c", "src/host/host_stop.c", "src/host/host_walk.c", "src/host/host_watch.c", "src/host/main.c", "src/host/say.c", "src/host/say.h", "tests/modules/hello.c", "tests/modules/hello.h", "tests/modules/knock.c", "tests/modules/word.h", "tests/presets/grants.toml", "tests/presets/native.toml", "tests/presets/test.toml", "tests/presets/world.toml", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "two arguments where the first is not the show flag"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/none.toml", "extra"]

[case.claims]
status = 2
has = ["usage: bridge-host"]

[case.false]
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/none.toml"]

[[case]]
name = "an argument that begins with a dash"
process = "command"
run = ["{out}/bridge-host{exe}", "-x"]

[case.claims]
status = 2
has = ["usage: bridge-host"]

[case.false]
run = ["{out}/bridge-host{exe}", "{case}/none.toml"]

[[case]]
name = "a module that logs below the shown level"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/dbg.toml"]

[case.claims]
status = 0
has = ["loaded: bridge-host:debugger@1.0.0, wasm"]
lacks = ["deep"]

[case.folders]
"{case}/mods" = ["debugger"]

[case.files]
"{case}/dbg.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 8
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/dbg.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 8
[content]
paths = ["mods"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
[records]
written = 7
'''

[[case]]
name = "a record of a level above the written level is not written"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/rec.toml"]

[case.claims]
status = 0
line = ["loaded: bridge-host:knock@1.0.0, native, mods/knock{library}"]
lacks = ["record[6] bridge-host:knock@1.0.0/say: knock 0 0"]

[case.folders]
"{case}/mods" = ["knock"]

[case.files]
"{case}/rec.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
again = {}
rounds = 8
[records]
written = 5
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/rec.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
again = {}
rounds = 8
[records]
written = 6
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[[case]]
name = "a record of the failing level or lower makes the run fail"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/rec.toml"]

[case.claims]
status = 1
line = ["record[6] bridge-host:knock@1.0.0/say: knock 0 0"]

[case.folders]
"{case}/mods" = ["knock"]

[case.files]
"{case}/rec.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
again = {}
rounds = 8
[records]
failing = 6
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/rec.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
again = {}
rounds = 8
[records]
failing = 3
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''
