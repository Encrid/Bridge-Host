[[case]]
name = "a content path that starts with a slash is used as it is"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/whole.toml"]

[case.claims]
status = 1
has = ["cannot look in '/no-such-abs-one'"]

[case.files]
"{case}/whole.toml" = '''
presets = ["{root}/tests/presets/test.toml", "d/paths.toml"]
phases = ["update"]
again = {}
rounds = 8
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''
"{case}/d/paths.toml" = '''
[content]
paths = ['/no-such-abs-one']
'''

[case.false.files]
"{case}/d/paths.toml" = '''
[content]
paths = ['no-such-abs-one']
'''

