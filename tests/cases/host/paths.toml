[[case]]
name = "a preset whose name is empty"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/emptypre.toml"]

[case.claims]
status = 1
has = ["cannot read '"]

[case.files]
"{case}/emptypre.toml" = '''
presets = [""]
'''

[case.false.files]
"{case}/emptypre.toml" = '''
presets = ["{root}/tests/presets/world.toml"]
'''

[[case]]
name = "a config named with a backslash in the path"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/sub\\x.toml"]

[case.claims]
status = 1
has = ["not stated: phases"]

[case.files]
"{case}/sub/x.toml" = '''
rounds = 1
'''

[case.false.files]
"{case}/sub/x.toml" = '''
rounds = 1
phases = ["update"]
again = {}
'''

