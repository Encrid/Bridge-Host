[[case]]
name = "a backend takes its settings from its table, and refuses a setting that it does not know"
run = ["{out}/bridge-host{exe}", "{case}/bs.toml"]

[case.claims]
status = 1
has = ["backend 'native' would not start: it knows no setting 'colour'"]
line = ["bridge_create refused"]

[case.folders]
"{case}/mods" = ["knock"]

[case.files]
"{case}/bs.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
colour = "blue"
'''

[case.false.files]
"{case}/bs.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
