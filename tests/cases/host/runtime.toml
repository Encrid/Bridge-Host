[[case]]
name = "a backend stated two ways"
run = ["{out}/bridge-host{exe}", "{case}/bconf.toml"]

[case.claims]
status = 1
has = ["refused: backend.wasm.library: "]

[case.folders]
"{case}/cq" = ["quiet"]

[case.files]
"{case}/bc1.toml" = '''
[backend.wasm]
library = "a"
'''
"{case}/bc2.toml" = '''
[backend.wasm]
library = "b"
'''
"{case}/bconf.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/wasm.toml", "bc1.toml", "bc2.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
'''

[case.false.files]
"{case}/bc2.toml" = '''
'''
"{case}/bconf.toml" = '''
presets = ["{root}/tests/presets/test.toml", "bc2.toml"]
phases = ["update"]
rounds = 8
[content]
paths = ["cq"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

