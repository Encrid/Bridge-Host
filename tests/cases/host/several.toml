code = ["include/**", "src/host/config/**", "src/host/file_bytes.c", "src/host/file_bytes.h", "src/host/host.h", "src/host/host_again.c", "src/host/host_alloc.c", "src/host/host_alloc.h", "src/host/host_arrive.c", "src/host/host_end.c", "src/host/host_free.c", "src/host/host_list.c", "src/host/host_load.c", "src/host/host_lock.c", "src/host/host_look.c", "src/host/host_meet.c", "src/host/host_path.c", "src/host/host_run.c", "src/host/host_slot.c", "src/host/host_stop.c", "src/host/host_walk.c", "src/host/host_watch.c", "src/host/main.c", "src/host/say.c", "src/host/say.h", "tests/modules/hello.h", "tests/modules/knock.c", "tests/modules/word.h", "tests/presets/test.toml", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "two configs at once"
process = "helper"
run = ["{out}/bridge-host{exe}", "{case}/two.toml"]
stdin = "go\n"

[case.claims]
status = 0
has = ["destroyed: 0"]

[case.helper]
run = ["{out}/bridge-host{exe}", "{case}/one.toml"]
wait = "? go on"
stdin = "go\n"

[case.helper.claims]
status = 0
has = ["destroyed: 0"]

[case.folders]
"{case}/together-one" = ["wait"]
"{case}/together-two" = ["wait"]

[case.files]
"{case}/one.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["together-one"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''
"{case}/two.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["together-two"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false]
run = ["{out}/bridge-host{exe}", "{case}/one.toml"]

[[case]]
name = "one config twice"
process = "helper"
run = ["{out}/bridge-host{exe}", "{case}/one.toml"]
stdin = "go\n"

[case.claims]
status = 1
line = ["refused: one.toml is being run"]

[case.helper]
run = ["{out}/bridge-host{exe}", "{case}/one.toml"]
wait = "? go on"
stdin = "go\n"

[case.helper.claims]
status = 0

[case.folders]
"{case}/together-one" = ["wait"]
"{case}/together-two" = ["wait"]

[case.files]
"{case}/one.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["together-one"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''
"{case}/two.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["together-two"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false]
run = ["{out}/bridge-host{exe}", "{case}/two.toml"]
