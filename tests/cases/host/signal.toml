code = ["include/**", "src/host/config/**", "src/host/file_bytes.c", "src/host/file_bytes.h", "src/host/host.h", "src/host/host_again.c", "src/host/host_arrive.c", "src/host/host_end.c", "src/host/host_free.c", "src/host/host_load.c", "src/host/host_lock.c", "src/host/host_look.c", "src/host/host_meet.c", "src/host/host_path.c", "src/host/host_run.c", "src/host/host_slot.c", "src/host/host_stop.c", "src/host/host_walk.c", "src/host/host_watch.c", "src/host/main.c", "src/host/say.c", "src/host/say.h", "src/host/state/state.c", "src/host/state/state_find.c", "src/host/state/state_list.c", "src/host/state/state_made.c", "src/host/state/state_phase.c", "src/host/state/state_setting_find.c", "src/host/state/state_tell.c", "src/host/state/state_undeclared.c", "src/host/toml/toml.c", "src/host/toml/toml.h", "src/host/toml/toml_add.c", "src/host/toml/toml_free.c", "src/host/toml/toml_key.c", "src/host/toml/toml_number.c", "src/host/toml/toml_pair.c", "src/host/toml/toml_text.c", "src/host/toml/toml_value.c", "src/manifest/manifest.c", "src/manifest/manifest_check.c", "src/manifest/manifest_find.c", "src/manifest/manifest_inside.h", "src/manifest/manifest_keys.c", "src/manifest/manifest_list.c", "src/manifest/manifest_made.c", "src/manifest/manifest_own.c", "src/manifest/manifest_phase.c", "src/manifest/manifest_rules.c", "src/manifest/manifest_setting.c", "src/manifest/manifest_state.c", "src/manifest/manifest_take.c", "src/manifest/manifest_word.c", "src/manifest/manifest_words.c", "tests/modules/hello.h", "tests/modules/knock.c", "tests/modules/word.h", "tests/presets/grants.toml", "tests/presets/native.toml", "tests/presets/world.toml", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "a first signal stops the run after its round, and the host ends its work"
run = ["{out}/bridge-host{exe}", "{case}/sig.toml"]
stdin = "go\n"
script = [{ wait = "? go on", signal = "interrupt" }, { wait = "a signal stops the host: a second one ends it at once" }]

[case.claims]
status = 0
order = [
    "? go on",
    "a signal stops the host: a second one ends it at once",
    "ended at round 1: a signal stopped the run",
    "still loaded: bridge-host:wait@1.0.0",
    "destroyed: 0",
]

[case.folders]
"{case}/mods" = ["wait"]

[case.files]
"{case}/sig.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false]
script = [{ wait = "? go on", signal = "interrupt" }, { wait = "a signal stops the host: a second one ends it at once", signal = "interrupt", pause = 1 }]

[[case]]
name = "a second signal ends the host at once, with the status 1"
run = ["{out}/bridge-host{exe}", "{case}/sig.toml"]
stdin = "go\n"
script = [{ wait = "? go on", signal = "interrupt" }, { wait = "a signal stops the host: a second one ends it at once", signal = "interrupt", pause = 1 }]

[case.claims]
status = 1
order = ["? go on", "a signal stops the host: a second one ends it at once"]
lacks = ["destroyed:"]

[case.folders]
"{case}/mods" = ["wait"]

[case.files]
"{case}/sig.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false]
script = [{ wait = "? go on", signal = "interrupt" }, { wait = "a signal stops the host: a second one ends it at once" }]

[[case]]
name = "a host that cannot catch the signals does not run"
run = ["{out}/bridge-host{exe}", "{case}/sig.toml"]
fail = { os_signal_catch = 1 }

[case.claims]
status = 1
line = ["cannot catch the signals"]
lacks = ["loaded:"]

[case.folders]
"{case}/mods" = ["knock"]

[case.files]
"{case}/sig.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
again = {}
rounds = 16
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false]
fail = {}
