[[case]]
name = "a module that states keys and settings in its own file"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/owns.toml"]

[case.claims]
status = 1
has = [
    "pinned = true  its file",
    "reloadable = true  its file",
    "scratch = 100  its file",
    "its file states log_level: a level, from 1 to 7",
    "its file states on_error: \"fail\" or \"skip\"",
]

[case.folders]
"{case}/mods" = ["owns"]

[case.files]
"{case}/owns.toml" = '''
threads = 1
live = false
stack = 1048576
observer_passes = 1
table_growth = 150
table_hash_fill = 50
table_retry = 50
phases = ["update"]
rounds = 8
[budget]
entities = 8192
tables = 8
types = 16
systems = 16
terms = 8
modules = 8
persistent = 262144
columns = 1048576
sparse_sets = "none"
direct_indexed = "none"
[checks]
profile = false
validate = false
[records]
written = 6
failing = 3
[content]
paths = ["mods"]
[content.load]
all = true
[content.arrive]
wasm = "load"
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
'''

[case.false.folders]
"{case}/mods" = ["quiet"]

[[case]]
name = "settings of every kind, grants, losses, and an own setting"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/st.toml"]

[case.claims]
status = 0
has = [
    "config.w = \"p\"",
    "config.x = 5",
    "config.y = 1.5",
    "config.z = true",
    'read = ["bridge-host:Word", "a:b@1"]',
    'write = ["c:d@1"]',
    'losses = ["e:f@1"]  st.toml:13',
    "config.word = \"its own\"  its file",
]

[case.folders]
"{case}/mods" = ["multi", "word", "owned"]

[case.files]
"{case}/grants.toml" = '''
[module."bridge-host:word@1.0.0"]
read = ["bridge-host:Word", "a:b@1"]
'''
"{case}/st.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/wasm.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml", "grants.toml"]
phases = ["update", "late"]
rounds = 8
[content]
paths = ["mods"]
[module."bridge-host:multi@1.0.0".config]
w = { path = "p" }
x = 5
y = 1.5
z = true
[module."bridge-host:word@1.0.0"]
write = ["c:d@1"]
losses = ["e:f@1"]
[module."bridge-host:word@1.0.0".config]
word = "hi"
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/mods" = ["quiet"]

[[case]]
name = "on_error fail and a module key stated two ways"
run = ["{out}/bridge-host{exe}", "--show-config", "{case}/sk.toml"]

[case.claims]
status = 0
has = [
    "hot_reload = false",
    "over ta.toml:2, over tb.toml:2",
    'on_error = "fail"',
]

[case.folders]
"{case}/mods" = ["quiet"]

[case.files]
