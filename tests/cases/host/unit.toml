rows = [
    { name = "the toml parser and the value rules, every branch", in = "hi", claims = { has = ["unit ok"], line = ["[\"hi\", 42, 3.5, true, [100, 200, 300]]", "false", "{}", "status 0"] }, false = "ho" },
