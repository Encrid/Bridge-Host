[[case]]
name = "a module, a setting, a phase"
run = ["{out}/bridge-host{exe}", "{case}/word.toml"]

[case.claims]
status = 0
order = [
    "loaded: bridge-host:word@1.0.0, wasm, word/word.wasm",
    "record[6] bridge-host:word@1.0.0/say: hi 0 0",
]

[case.folders]
"{case}/word" = ["word"]

[case.files]
"{case}/word.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["late"]
again = {}
rounds = 8
[module."bridge-host:word@1.0.0".config]
word = "hi"
[content]
paths = ["word"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/word.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["update"]
again = {}
rounds = 8
[module."bridge-host:word@1.0.0".config]
word = "hi"
[content]
paths = ["word"]
[backend.wasm]
library = "{bb_wasm}/bridge_wasm"
[backend.native]
library = "{bb_native}/bridge_native"
'''

