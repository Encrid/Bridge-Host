[[case]]
name = "with no pair, the modules shut down by identity"
run = ["{out}/bridge-host{exe}", "{case}/u.toml"]

[case.claims]
status = 0
order = ["still loaded: bridge-host:stopa@1.0.0, bridge-host:stopb@1.0.0", "shutdown a", "shutdown b", "destroyed: 0"]

[case.folders]
"{case}/mods" = ["stopa", "stopb"]

[case.files]
"{case}/u.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
again = {}
rounds = 1
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/u.toml" = '''
presets = ["{root}/tests/presets/world.toml", "{root}/tests/presets/native.toml", "{root}/tests/presets/grants.toml"]
phases = ["update"]
again = {}
rounds = 1
[content]
paths = ["mods"]
[backend.native]
library = "{bb_native}/bridge_native"
[order]
unload_before = [["bridge-host:stopb", "bridge-host:stopa"]]
'''

