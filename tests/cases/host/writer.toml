code = ["include/**", "src/host/config/**", "src/host/file_bytes.c", "src/host/file_bytes.h", "src/host/host.h", "src/host/host_again.c", "src/host/host_arrive.c", "src/host/host_end.c", "src/host/host_free.c", "src/host/host_list.c", "src/host/host_load.c", "src/host/host_lock.c", "src/host/host_look.c", "src/host/host_meet.c", "src/host/host_path.c", "src/host/host_run.c", "src/host/host_slot.c", "src/host/host_stop.c", "src/host/host_walk.c", "src/host/host_watch.c", "src/host/main.c", "src/host/say.c", "src/host/say.h", "src/host/state/**", "tests/modules/hello.c", "tests/modules/hello.h", "tests/modules/knock.c", "tests/modules/word.c", "tests/modules/word.h", "tests/presets/test.toml", "tests/presets/world.toml", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "usage when no config is named"
process = "command"
run = ["{out}/bridge-host{exe}"]

[case.claims]
status = 2
has = ["usage: bridge-host <config.toml>"]

[case.false]
run = ["{out}/bridge-host{exe}", "{case}/none.toml"]

[[case]]
name = "a line that finds no memory still comes whole"
process = "command"
run = ["{out}/bridge-host{exe}"]
fail = { realloc = 1 }

[case.claims]
status = 2
line = ["usage: bridge-host <config.toml>"]

[case.false]
run = ["{out}/bridge-host{exe}", "{case}/none.toml"]

[[case]]
name = "a config whose folder is not there"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/gone/deep.toml"]

[case.claims]
status = 1
has = ["cannot go into '"]

[case.false.folders]
"{case}/gone" = []

[[case]]
name = "a config that cannot be read"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/missing.toml"]

[case.claims]
status = 1
has = ["cannot read '"]

[case.false.files]
"{case}/missing.toml" = '''
rounds = 1
'''

[[case]]
name = "presets that are not a list of files"
process = "command"
run = ["{out}/bridge-host{exe}", "{case}/plist.toml"]

[case.claims]
status = 1
line = ["refused: plist.toml:1: presets: a list of files"]

[case.files]
"{case}/plist.toml" = '''
presets = "nope"
[content]
paths = ["cq"]
'''

[case.false.files]
"{case}/plist.toml" = '''
presets = ["nope"]
[content]
paths = ["cq"]
'''

