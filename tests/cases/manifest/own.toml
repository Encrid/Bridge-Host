    { name = "the search of a Mach-O file ends at the first segment that holds the manifest", in = "read #c4 0:cffaedfe 10:02 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1", claims = { line = ["who: m:m@1 backend native abi 1"] }, false = "read #c4 0:cffaedfe 10:02 20:01 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1" },
