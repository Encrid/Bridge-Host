    { name = "an identity with no version is refused", in = "read w:m abi=1", claims = { line = ["no manifest: its manifest does not begin with who it is"] }, false = "read w:m@1 abi=1" },
    { name = "a first word with an equals sign is no identity", in = "read w:m@1=x abi=1", claims = { line = ["no manifest: its manifest does not begin with who it is"] }, false = "read w:m@1 abi=1" },
    { name = "an identity of 127 bytes is taken", in = "read w:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@1 abi=1", claims = { matches = ["who: w:a{123}@1 backend wasm abi 1"] }, false = "read w:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@1 abi=1" },
    { name = "an identity of 128 bytes is refused", in = "read w:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@1 abi=1", claims = { line = ["no manifest: its identity has more than 127 bytes"] }, false = "read w:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@1 abi=1" },
    { name = "a manifest with no abi is refused", in = "read w:m@1", claims = { line = ["no manifest: states no abi"] }, false = "read w:m@1 abi=1" },
    { name = "an abi of 0 is no abi", in = "read w:m@1 abi=0", claims = { line = ["no manifest: states no abi"] }, false = "read w:m@1 abi=1" },
    { name = "an abi of 4294967295 is taken", in = "read w:m@1 abi=4294967295", claims = { line = ["who: w:m@1 backend wasm abi 4294967295"] }, false = "read w:m@1 abi=4294967296" },
