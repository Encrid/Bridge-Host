code = ["include/**", "src/host/config/config.h", "src/host/file_bytes.h", "src/host/host.h", "src/host/say.h", "src/manifest/**", "tests/manifest/**", "tests/modules/hello.h", "tests/modules/knock.c", "tests/modules/word.h", "tools/**", ".toolchain/config/**", ".toolchain/project.toml"]

[[case]]
name = "manifest"
run = ["{out}/manifest-unit{exe}"]
sweep = ["calloc", "malloc", "realloc"]
claims = { status = 0 }
rows = [
    { name = "the manifest finds a key that a module states", in = "find hot_reload @{case}/mods/stated{library}", claims = { line = ["found: hot_reload = true", "status 0"] }, false = "find on_error @{case}/mods/stated{library}" },
    { name = "the manifest finds a key of 2 names", in = "find top.sub @{case}/mods/stated{library}", claims = { line = ["found: sub = true", "status 0"] }, false = "find top.other @{case}/mods/stated{library}" },
    { name = "a key that a module states 2 times is told, and not found", in = "find scratch @{case}/mods/stated{library}", claims = { order = ["twice: scratch", "none: scratch"], line = ["status 0"] }, false = "find hot_reload @{case}/mods/stated{library}" },
    { name = "a key with a value that its rule refuses is told, and not found", in = "find log_level @{case}/mods/stated{library}", claims = { order = ["wrong: log_level = true (a level, from 1 to 7)", "none: log_level"], line = ["status 0"] }, false = "find hot_reload @{case}/mods/stated{library}" },
    { name = "a key whose name finds no memory is not found", in = "+refuse calloc=2 find hot_reload @{case}/mods/stated{library}", claims = { line = ["none: hot_reload", "status 0"] }, false = "find hot_reload @{case}/mods/stated{library}" },
    { name = "a library of this system gives who it is", in = "read @{case}/mods/stated{library}", claims = { matches = ["who: bridge-host:stated@1\\.0\\.0 backend native abi [1-9]"] }, false = "read @{case}/mods/none{library}" },
    { name = "a file that is not there has no manifest", in = "read @{case}/mods/none{library}", claims = { line = ["no manifest: no file", "status 1"] }, false = "read @{case}/mods/stated{library}" },
    { name = "a value that the host cannot parse is not found", in = "find hot_reload deaf w:m@1 abi=1 hot_reload=true", claims = { line = ["none: hot_reload"] }, false = "find hot_reload w:m@1 abi=1 hot_reload=true" },
    { name = "a count of 0 is told as wrong", in = "find scratch w:m@1 abi=1 scratch=0", claims = { order = ["wrong: scratch = 0 (a whole number, from 1)", "none: scratch"] }, false = "find scratch w:m@1 abi=1 scratch=1" },
    { name = "a file of 64 bytes that begins with MZ is a library", in = "read #40 0:4d5a", claims = { line = ["no manifest: no manifest", "backend: native"] }, false = "read #3f 0:4d5a" },
    { name = "a file of 63 bytes is no library", in = "read #3f 0:4d5a", claims = { line = ["no manifest: neither a wasm module nor a library"] }, false = "read #40 0:4d5a" },
    { name = "a file that begins like no format is no module", in = "read #40 0=hello", claims = { line = ["no manifest: neither a wasm module nor a library"] }, false = "read #40 0:4d5a" },
    { name = "a wasm file of 8 bytes is a module with no manifest", in = "read #8 0:0061736d01000000", claims = { line = ["no manifest: no manifest", "backend: wasm"] }, false = "read #7 0:0061736d010000" },
    { name = "a wasm file of 7 bytes is no module", in = "read #7 0:0061736d010000", claims = { line = ["no manifest: neither a wasm module nor a library"] }, false = "read #8 0:0061736d01000000" },
    { name = "an ELF file of 32 bits is no library", in = "read #40 0:7f454c460101", claims = { line = ["no manifest: neither a wasm module nor a library"] }, false = "read #40 0:7f454c460201" },
    { name = "a PE library gives a manifest that ends at the end of the file", in = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:80 80=p:m@1 86=abi=1", claims = { line = ["who: p:m@1 backend native abi 1"] }, false = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:0d 68:0d 6c:80 80=p:m@1 86=abi=1" },
    { name = "a PE manifest that ends 1 byte after the file is not found", in = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:0d 68:0d 6c:80 80=p:m@1 86=abi=1", claims = { line = ["no manifest: no manifest", "backend: native"] }, false = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:80 80=p:m@1 86=abi=1" },
    { name = "a PE manifest that starts after the file is not found", in = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:ff01 80=p:m@1 86=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:80 80=p:m@1 86=abi=1" },
    { name = "a PE section table that ends at the end of the file is read", in = "read #80 0:4d5a 10=p:m@1 16=abi=1 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:10", claims = { line = ["who: p:m@1 backend native abi 1"] }, false = "read #7f 0:4d5a 10=p:m@1 16=abi=1 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:10" },
    { name = "a PE section table that ends 1 byte after the file is not read", in = "read #7f 0:4d5a 10=p:m@1 16=abi=1 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:10", claims = { line = ["no manifest: no manifest"] }, false = "read #80 0:4d5a 10=p:m@1 16=abi=1 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:10" },
    { name = "a PE header that starts after the file has no manifest", in = "read #40 0:4d5a 3c:7f", claims = { line = ["no manifest: no manifest", "backend: native"] }, false = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:80 80=p:m@1 86=abi=1" },
    { name = "a PE header with no signature has no manifest", in = "read #8c 0:4d5a 3c:40 40:5046 46:01 58=.bridge 60:0c 68:0c 6c:80 80=p:m@1 86=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:80 80=p:m@1 86=abi=1" },
    { name = "the second PE section can hold the manifest", in = "read #b4 0:4d5a 3c:40 40:5045 46:02 58=.text 80=.bridge 88:0c 90:0c 94:a8 a8=p:m@1 ae=abi=1", claims = { line = ["who: p:m@1 backend native abi 1"] }, false = "read #b4 0:4d5a 3c:40 40:5045 46:01 58=.text 80=.bridge 88:0c 90:0c 94:a8 a8=p:m@1 ae=abi=1" },
    { name = "a PE section whose name only begins with .bridge is not the manifest", in = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridged 60:0c 68:0c 6c:80 80=p:m@1 86=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:0c 68:0c 6c:80 80=p:m@1 86=abi=1" },
    { name = "a PE manifest has the virtual size when it is the smaller size", in = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:0c 68:7f 6c:80 80=p:m@1 86=abi=1", claims = { line = ["who: p:m@1 backend native abi 1"] }, false = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:7f 68:7f 6c:80 80=p:m@1 86=abi=1" },
    { name = "a PE manifest has the raw size when it is the smaller size", in = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:7f 68:0c 6c:80 80=p:m@1 86=abi=1", claims = { line = ["who: p:m@1 backend native abi 1"] }, false = "read #8c 0:4d5a 3c:40 40:5045 46:01 58=.bridge 60:7f 68:7f 6c:80 80=p:m@1 86=abi=1" },
    { name = "a PE optional header moves the section table", in = "read #94 0:4d5a 3c:40 40:5045 46:01 54:08 60=.bridge 68:0c 70:0c 74:88 88=p:m@1 8e=abi=1", claims = { line = ["who: p:m@1 backend native abi 1"] }, false = "read #94 0:4d5a 3c:40 40:5045 46:01 54:00 60=.bridge 68:0c 70:0c 74:88 88=p:m@1 8e=abi=1" },
    { name = "an ELF library gives a manifest that ends at the end of the file", in = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1", claims = { line = ["who: e:m@1 backend native abi 1"] }, false = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0d 98:c0 c1=.bridge d0=e:m@1 d6=abi=1" },
    { name = "an ELF manifest that ends 1 byte after the file is not found", in = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0d 98:c0 c1=.bridge d0=e:m@1 d6=abi=1", claims = { line = ["no manifest: no manifest", "backend: native"] }, false = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1" },
    { name = "an ELF manifest that starts after the file is not found", in = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:ff01 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1" },
    { name = "an ELF section table that starts after the file has no manifest", in = "read #dc 0:7f454c460201 28:ff01 3c:02 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1" },
    { name = "an ELF file with more sections than it holds has no manifest", in = "read #dc 0:7f454c460201 28:40 3c:03 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1" },
    { name = "an ELF index of the names that is the count of the sections has no manifest", in = "read #dc 0:7f454c460201 28:40 3c:02 3e:02 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1" },
    { name = "an ELF table of names that starts after the file has no manifest", in = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0c 98:ff01 c1=.bridge d0=e:m@1 d6=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1" },
    { name = "the second ELF section can hold the manifest", in = "read #dc 0:7f454c460201 28:40 3c:02 3e:00 58:c0 80:01 98:d0 a0:0c c1=.bridge d0=e:m@1 d6=abi=1", claims = { line = ["who: e:m@1 backend native abi 1"] }, false = "read #dc 0:7f454c460201 28:40 3c:02 3e:00 58:c0 80:00 98:d0 a0:0c c1=.bridge d0=e:m@1 d6=abi=1" },
    { name = "an ELF section name that ends at the end of the file is read", in = "read #d5 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:c0 60:0c 98:cc c0=e:m@1 c6=abi=1 cd=.bridge", claims = { line = ["who: e:m@1 backend native abi 1"] }, false = "read #d4 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:c0 60:0c 98:cc c0=e:m@1 c6=abi=1 cd=.bridge" },
    { name = "an ELF section name that ends 1 byte after the file is not read", in = "read #d4 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:c0 60:0c 98:cc c0=e:m@1 c6=abi=1 cd=.bridge", claims = { line = ["no manifest: no manifest"] }, false = "read #d5 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:c0 60:0c 98:cc c0=e:m@1 c6=abi=1 cd=.bridge" },
    { name = "an ELF section with a different name is not the manifest", in = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridgx d0=e:m@1 d6=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #dc 0:7f454c460201 28:40 3c:02 3e:01 40:01 58:d0 60:0c 98:c0 c1=.bridge d0=e:m@1 d6=abi=1" },
    { name = "a Mach-O library gives a manifest that ends at the end of the file", in = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1", claims = { line = ["who: m:m@1 backend native abi 1"] }, false = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0d 98:b8 b8=m:m@1 be=abi=1" },
    { name = "a Mach-O manifest that ends 1 byte after the file is not found", in = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0d 98:b8 b8=m:m@1 be=abi=1", claims = { line = ["no manifest: no manifest", "backend: native"] }, false = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1" },
    { name = "a Mach-O manifest that starts after the file is not found", in = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:ff01 b8=m:m@1 be=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1" },
    { name = "a Mach-O section of a segment that is not __TEXT is not the manifest", in = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__DATA 90:0c 98:b8 b8=m:m@1 be=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1" },
    { name = "a Mach-O section with a different name is not the manifest", in = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridgx 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1" },
    { name = "a Mach-O command that is no segment has no manifest", in = "read #c4 0:cffaedfe 10:01 20:01 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1" },
    { name = "the second Mach-O command can be the segment", in = "read #dc 0:cffaedfe 10:02 20:02 24:18 38:19 3c:98 78:01 80=.bridge 90=__TEXT a8:0c b0:d0 d0=m:m@1 d6=abi=1", claims = { line = ["who: m:m@1 backend native abi 1"] }, false = "read #dc 0:cffaedfe 10:01 20:02 24:18 38:19 3c:98 78:01 80=.bridge 90=__TEXT a8:0c b0:d0 d0=m:m@1 d6=abi=1" },
    { name = "a Mach-O command of size 0 ends the search", in = "read #dc 0:cffaedfe 10:02 20:02 24:00 38:19 3c:98 78:01 80=.bridge 90=__TEXT a8:0c b0:d0 d0=m:m@1 d6=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #dc 0:cffaedfe 10:02 20:02 24:18 38:19 3c:98 78:01 80=.bridge 90=__TEXT a8:0c b0:d0 d0=m:m@1 d6=abi=1" },
    { name = "the second Mach-O section can hold the manifest", in = "read #114 0:cffaedfe 10:01 20:19 24:e8 60:02 68=.text 78=__TEXT b8=.bridge c8=__TEXT e0:0c e8:0801 108=m:m@1 10e=abi=1", claims = { line = ["who: m:m@1 backend native abi 1"] }, false = "read #114 0:cffaedfe 10:01 20:19 24:e8 60:01 68=.text 78=__TEXT b8=.bridge c8=__TEXT e0:0c e8:0801 108=m:m@1 10e=abi=1" },
    { name = "a Mach-O section that ends at the end of the file is read", in = "read #b8 0:cffaedfe 4=m:m@1 a=abi=1 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:04", claims = { line = ["who: m:m@1 backend native abi 1"] }, false = "read #b7 0:cffaedfe 4=m:m@1 a=abi=1 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:04" },
    { name = "a Mach-O section that ends 1 byte after the file is not read", in = "read #b7 0:cffaedfe 4=m:m@1 a=abi=1 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:04", claims = { line = ["no manifest: no manifest"] }, false = "read #b8 0:cffaedfe 4=m:m@1 a=abi=1 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:04" },
    { name = "a Mach-O segment that states more sections than the file holds has no manifest", in = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:63 68=.text 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #c4 0:cffaedfe 10:01 20:19 24:98 60:01 68=.bridge 78=__TEXT 90:0c 98:b8 b8=m:m@1 be=abi=1" },
    { name = "a wasm module gives its manifest", in = "read w:m@1 abi=1", claims = { line = ["who: w:m@1 backend wasm abi 1", "words: config '' settings '' pinned 0 reloadable 0", "status 0"] }, false = "read w:m@1" },
    { name = "a wasm section before the manifest is passed", in = "read #29 0:0061736d01000000 8:010100 b:001c0f e=bridge:manifest 1d=w:m@1 23=abi=1", claims = { line = ["who: w:m@1 backend wasm abi 1"] }, false = "read #29 0:0061736d01000000 8:010200 b:001c0f e=bridge:manifest 1d=w:m@1 23=abi=1" },
    { name = "a wasm section that ends after the file has no manifest", in = "read #a 0:0061736d01000000 8:007f", claims = { line = ["no manifest: no manifest", "backend: wasm"] }, false = "read w:m@1 abi=1" },
    { name = "a wasm custom section with a different name is not the manifest", in = "read #29 0:0061736d01000000 8:010100 b:001c0f e=bridge:manifesx 1d=w:m@1 23=abi=1", claims = { line = ["no manifest: no manifest"] }, false = "read #29 0:0061736d01000000 8:010100 b:001c0f e=bridge:manifest 1d=w:m@1 23=abi=1" },
    { name = "a wasm custom section with a shorter name is not the manifest", in = "read #13 0:0061736d01000000 8:000906 b=bridge:m", claims = { line = ["no manifest: no manifest"] }, false = "read w:m@1 abi=1" },
    { name = "a wasm name that its section cuts is not the manifest", in = "read #f 0:0061736d01000000 8:00050f b=brid", claims = { line = ["no manifest: no manifest"] }, false = "read w:m@1 abi=1" },
    { name = "a wasm number of more than 5 bytes has no manifest", in = "read #10 0:0061736d01000000 8:00808080808080", claims = { line = ["no manifest: no manifest"] }, false = "read w:m@1 abi=1" },
    { name = "a wasm file that ends before the size of a section has no manifest", in = "read #9 0:0061736d01000000", claims = { line = ["no manifest: no manifest"] }, false = "read w:m@1 abi=1" },
    { name = "a manifest section with no byte is no manifest", in = "read", claims = { line = ["no manifest: no manifest", "backend: wasm"] }, false = "read w:m@1 abi=1" },
    { name = "a manifest that begins with a zero byte is empty", in = 'read ""', claims = { line = ["no manifest: its manifest is empty"] }, false = "read w:m@1 abi=1" },
    { name = "a last word with no zero byte at its end is refused", in = "read w:m@1 abi=1^", claims = { line = ["no manifest: its manifest has a word with no zero byte at its end"] }, false = "read w:m@1 abi=1" },
    { name = "the words end at an empty word", in = 'read w:m@1 "" abi=1', claims = { line = ["no manifest: states no abi"] }, false = "read w:m@1 abi=1" },
